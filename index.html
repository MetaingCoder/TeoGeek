<head>

<div class="site-shell">

<a class="brand" href="/"><span class="brand-mark">T</span><span class="brand-name">TeoGeek</span></a>
<nav class="top-nav">
<button class="icon-button" id="searchBtn" aria-label="搜索" title="搜索">⌕</button>
<a href="/#archive">归档</a><a href="/#about">关于</a><a href="/rss.xml">RSS</a>
</nav>
</header>
<p class="site-description">记录开发与折腾，分享科技背后的思考与创造。</p>

</section>

<p>TeoGeek 是一个纯静态的个人科技博客，用来记录开发、开源、工具、AI 以及各种折腾过程。</p>
<p>文章以 Markdown 保存，前端负责读取和渲染；GitHub Actions 负责生成文章索引并部署到 Cloudflare Pages。</p>
</section>
</main>
